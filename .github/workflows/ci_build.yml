name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # run on the 1st of the month for new petsc release
  # do it at 2am UTC so that the CI builds have finished
  schedule:
    - cron: '0 2 1 * *'    

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:       

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      branch: ${{ steps.determine_branch.outputs.branch }}
      commit: ${{ github.sha }}
      head_commit: ${{ steps.determine_branch.outputs.head_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine branch
        id: determine_branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            echo "head_commit=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "head_commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: free disk space
        run: |
          docker system prune --volumes -af            

  gnu_debug:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image with debug PETSc
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile
          build-args: |
            ARCH=arch-linux-c-debug

  gnu_debug_malloc_dump:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image with debug PETSc and malloc dump flag
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile
          build-args: |
            ARCH=arch-linux-c-debug
            MALLOC_DUMP=true

  gnu_debug_valgrind:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image and run tests_short with valgrind
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile_valgrind
          build-args: |
            ARCH=arch-linux-c-debug

  gnu_opt:
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image for non-pull-request events
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          context: .
          file: ./dockerfiles/Dockerfile
          tags: stevendargaville/pflare:latest
          build-args: |
            ARCH=arch-linux-c-opt

      - name: Build Docker image for pull requests
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          load: true
          context: .
          file: ./dockerfiles/Dockerfile
          tags: pflare:pr-ci
          build-args: |
            ARCH=arch-linux-c-opt

      - name: Build notebook CI image and execute notebooks for pull requests
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          file: ./dockerfiles/Dockerfile_notebook
          build-args: |
            BASE_IMAGE=pflare:pr-ci

      - name: Run parser output tests
        run: |
          IMAGE=${{ github.event_name == 'pull_request' && 'pflare:pr-ci' || 'stevendargaville/pflare:latest' }}
          docker run --rm \
            -v "${{ github.workspace }}/tools:/pflare_ci_tools:ro" \
            -v "${{ github.workspace }}/python:/pflare_ci_python:ro" \
            -e PFLARE_TESTS_DIR=/build/PFLARE/tests \
            -e PFLARE_TOOLS_DIR=/pflare_ci_tools \
            "$IMAGE" \
            python3 /pflare_ci_python/run_parse_tests.py

      - name: Test pip install of the Python bindings
        run: |
          IMAGE=${{ github.event_name == 'pull_request' && 'pflare:pr-ci' || 'stevendargaville/pflare:latest' }}
          docker run -i --rm "$IMAGE" bash -s <<'EOF'
          set -e
          export PYTHONPATH=$PETSC_DIR/$PETSC_ARCH/lib
          export LIBRARY_PATH=/build/PFLARE/lib
          python3 -m pip install --no-build-isolation --no-deps /build/PFLARE/python
          # Run from outside the source tree so the installed copy is imported
          cd /tmp
          export LD_LIBRARY_PATH=/build/PFLARE/lib:$PETSC_DIR/$PETSC_ARCH/lib
          # The installed version must match the VERSION.txt file
          test "$(python3 -m pip show pflare | awk '/^Version:/{print $2}')" = "$(cat /build/PFLARE/VERSION.txt)"
          python3 -c "import pflare; assert pflare.pcair_set_z_type.__doc__"
          python3 /build/PFLARE/python/ex2.py -ksp_max_it 5
          EOF

  gnu_opt_64_bit:
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image for pull requests with 64-bit PETSc
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          context: .
          file: ./dockerfiles/Dockerfile_64_bit
          tags: stevendargaville/pflare_64_bit:latest
          build-args: |
            ARCH=arch-linux-c-opt

  gnu_opt_kokkos:
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image with KOKKOS and PETSc
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile_kokkos
          build-args: |
            ARCH=arch-linux-c-opt
            
  gnu_opt_kokkos_malloc_dump:
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image with KOKKOS and PETSc and malloc dump flag
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile_kokkos
          build-args: |
            ARCH=arch-linux-c-opt
            MALLOC_DUMP=true
        
  gnu_debug_kokkos_valgrind:
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image and run tests_short with valgrind and KOKKOS
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile_kokkos_valgrind
          build-args: |
            ARCH=arch-linux-c-debug

  gnu_debug_kokkos_single_prefix:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image with single precision, KOKKOS and debug PETSc with prefix DIR
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile_kokkos
          build-args: |
            ARCH=
            PETSC_DIR=/build/petsc_prefix            

  gnu_opt_64_bit_kokkos:
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image with KOKKOS and 64-bit PETSc
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile_kokkos
          build-args: |
            ARCH=arch-linux-c-opt-64bit

  # Use 2 OMP threads by default as the github action runners have 2 cores by default
  gnu_opt_omp_kokkos:
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image with KOKKOS OMP backend and PETSc
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile_kokkos
          build-args: |
            OMP_NUM_THREADS=2
            ARCH=arch-linux-c-opt-omp
            
  gnu_debug_no_mpi_kokkos:
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image with PETSc configured without MPI and with Kokkos
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile_no_mpi
          build-args: |
            ARCH=arch-linux-c-debug

  intel_opt:
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image with PETSc and Intel
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          context: .
          file: ./dockerfiles/Dockerfile_intel
          build-args: |
            ARCH=arch-linux-intel

  notebook_tutorial:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    needs: [gnu_opt]
    steps:
      - name: Build notebook CI image and execute notebooks
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          file: ./dockerfiles/Dockerfile_notebook
          build-args: |
            BASE_IMAGE=stevendargaville/pflare:latest

  # Now pflare tracks petsc main, we check to see if this commit and the docs
  # can still be built through the petsc configure
  # We do this by checking out petsc main and just replacing the hash it pulls down
  # for PFLARE to the hash from the merge commit for this branch
  gnu_petsc_config:
    runs-on: ubuntu-24.04
    needs: [setup]
    env:
      BRANCH: ${{ needs.setup.outputs.branch }}
      COMMIT: ${{ needs.setup.outputs.commit }}
      HEAD_COMMIT: ${{ needs.setup.outputs.head_commit }}
    steps:
      - name: Test build through PETSc configure
        shell: bash
        run: |
          set -euo pipefail
          export BRANCH="${{ env.BRANCH }}"
          export COMMIT="${{ env.COMMIT }}"
          export HEAD_COMMIT="${{ env.HEAD_COMMIT }}"
          echo "Using branch: ${BRANCH}"
          echo "Using commit: ${COMMIT}"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bash-completion ca-certificates chrpath cmake curl \
            flex g++ gcc gfortran git less libblis-serial-dev libfl-dev liblapack-dev libtool \
            locales m4 make openssl pkg-config ripgrep zlib1g-dev python3-virtualenv \
            python3-venv python3-dev wget valgrind vim

          export PETSC_DIR="$(pwd)/petsc"
          export PETSC_ARCH="arch-linux-c-debug"

          git clone --depth=1 --branch=main https://gitlab.com/petsc/petsc.git
          cd petsc

          python3 - "$COMMIT" <<'PY'
          import pathlib, sys
          commit = sys.argv[1]
          path = pathlib.Path("config/BuildSystem/config/packages/PFLARE.py")
          lines = path.read_text().splitlines()
          found = False
          for i, line in enumerate(lines):
              if line.strip().startswith("self.gitcommit"):
                  # Preserve indentation
                  indent = line[:line.find("self.gitcommit")]
                  lines[i] = f"{indent}self.gitcommit              = '{commit}'"
                  found = True
                  break
          if not found:
              sys.exit("gitcommit line not found in PFLARE.py")
          path.write_text("\n".join(lines) + "\n")
          PY

          python3 configure \
            --with-debugging=1 \
            --download-metis \
            --download-parmetis \
            --download-fblaslapack \
            --download-kokkos \
            --download-kokkos-kernels \
            --download-mpich \
            --download-pflare

          make PETSC_DIR="${PETSC_DIR}" PETSC_ARCH="${PETSC_ARCH}"
          make PETSC_DIR="${PETSC_DIR}" PETSC_ARCH="${PETSC_ARCH}" check

          # PETSc's doc build clones PFLARE with a plain `git clone` + `git checkout <gitcommit>`
          # to scan its manual pages, which can't see ${COMMIT} when it's a PR merge commit (only
          # a GitHub-internal ref, not a real clonable commit). Re-point gitcommit at
          # ${HEAD_COMMIT} - the PFLARE branch tip, not the merge commit - just for this doc scan;
          # the build/check above already ran against the real ${COMMIT} merge result.
          python3 - "$HEAD_COMMIT" <<'PY'
          import pathlib, sys
          commit = sys.argv[1]
          path = pathlib.Path("config/BuildSystem/config/packages/PFLARE.py")
          lines = path.read_text().splitlines()
          found = False
          for i, line in enumerate(lines):
              if line.strip().startswith("self.gitcommit"):
                  indent = line[:line.find("self.gitcommit")]
                  lines[i] = f"{indent}self.gitcommit              = '{commit}'"
                  found = True
                  break
          if not found:
              sys.exit("gitcommit line not found in PFLARE.py")
          path.write_text("\n".join(lines) + "\n")
          PY

          # --fail-on-warning (baked into the `docs` target) turns doctext warnings and
          # unresolved `PCFOO` cross-references into hard failures. Unset PETSC_ARCH so output
          # lands in doc/_build (the `docs` target otherwise copies doc -> ${PETSC_ARCH}-doc);
          # PETSC_DIR must stay set so conf.py scans THIS tree.
          unset PETSC_ARCH
          # PETSc's `docs` makefile recipe ends in `; deactivate`, so `make docs` exits 0
          # even when the inner Sphinx build (including the petsc4py sub-build) failed.
          # Capture the output and gate on it: Sphinx prints "Warning, treated as error"
          # on any doctext/cross-reference failure, and conf.py's build_petsc4py_docs prints
          # "End petsc4py docs" only after the petsc4py Sphinx build succeeds.
          make PETSC_DIR="${PETSC_DIR}" docs 2>&1 | tee docs_build.log
          if grep -q "Warning, treated as error" docs_build.log; then
            echo "Sphinx reported a warning-as-error during the docs build" >&2
            exit 1
          fi
          if ! grep -q "End petsc4py docs" docs_build.log; then
            echo "petsc4py doc build did not run to completion" >&2
            exit 1
          fi
          # Confirm PFLARE's pages made it all the way through to rendered HTML (a dropped
          # SUBMANSEC makes a page silently vanish rather than warn).
          test -f doc/_build/html/manualpages/PC/PCAIR.html
          test -f doc/_build/html/manualpages/PC/PCPFLAREINV.html

  # No docker on macos with github actions so have to just build petsc first
  # It then caches petsc for speed based on the hash of the HEAD of petsc main
  # so it will rebuild petsc only if there is a new main
  macos_debug:
    runs-on: macos-15
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          clang --version

      - name: Install deps
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install gcc open-mpi

      - name: Set up Python venv
        id: venv
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "pybin=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -U pip setuptools wheel numpy Cython

      - name: Locate Homebrew gfortran and create shim
        id: gf
        shell: bash
        run: |
          set -e
          GF=$(ls "$(brew --prefix)"/bin/gfortran-* | head -n1)
          echo "gf=$GF" >> "$GITHUB_OUTPUT"
          SHIM_DIR="$RUNNER_TEMP/gfortran-shim"
          mkdir -p "$SHIM_DIR"
          ln -sf "$GF" "$SHIM_DIR/gfortran"
          # Make shim available to future steps
          echo "$SHIM_DIR" >> "$GITHUB_PATH"
          # Also use it in THIS step (GITHUB_PATH only affects subsequent steps)
          export PATH="$SHIM_DIR:$PATH"
          gfortran --version
          # Sanity: ensure mpifort exists and can find gfortran now
          "$(brew --prefix open-mpi)"/bin/mpifort -showme

      - name: Get PETSc HEAD hash
        id: petsc_hash
        run: |
          echo "hash=$(git ls-remote https://gitlab.com/petsc/petsc.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache PETSc
        id: cache_petsc
        uses: actions/cache@v4
        with:
          path: petsc
          key: v1-petsc-macos15-debug-${{ steps.petsc_hash.outputs.hash }}

      - name: Build PETSc (debug, CPU, Open MPI + Fortran + petsc4py)
        if: steps.cache_petsc.outputs.cache-hit != 'true'
        shell: bash
        env:
          # Tell Open MPI wrappers exactly which gfortran to invoke
          OMPI_FC: ${{ steps.gf.outputs.gf }}
        run: |
          set -e
          export PETSC_DIR="$(pwd)/petsc"
          export PETSC_ARCH="arch-darwin-c-debug"
          git clone --depth=1 --branch=main https://gitlab.com/petsc/petsc.git
          cd petsc
          MPI_BIN="$(brew --prefix open-mpi)/bin"
          "${{ steps.venv.outputs.pybin }}" configure CC="${MPI_BIN}/mpicc" CXX="${MPI_BIN}/mpicxx" FC="${MPI_BIN}/mpifort" \
            --with-debugging=1 \
            --download-metis \
            --download-parmetis \
            --download-fblaslapack \
            --with-make-np=3 \
            --with-petsc4py=1 \
            --with-python-exec="${{ steps.venv.outputs.pybin }}"
          make -j3
      - name: Build PFLARE (debug, CPU)
        shell: bash
        run: |
          set -e
          export PETSC_DIR="$(pwd)/petsc"
          export PETSC_ARCH="arch-darwin-c-debug"
          cd "$GITHUB_WORKSPACE"
          make -j3
          make python
          make -j3 tests

  # 64 bit macos build with kokkos
  macos_64_bit_kokkos:
    runs-on: macos-15
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          clang --version

      - name: Install deps
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install gcc open-mpi

      - name: Set up Python venv
        id: venv
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "pybin=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -U pip setuptools wheel numpy Cython

      - name: Locate Homebrew gfortran and create shim
        id: gf
        shell: bash
        run: |
          set -e
          GF=$(ls "$(brew --prefix)"/bin/gfortran-* | head -n1)
          echo "gf=$GF" >> "$GITHUB_OUTPUT"
          SHIM_DIR="$RUNNER_TEMP/gfortran-shim"
          mkdir -p "$SHIM_DIR"
          ln -sf "$GF" "$SHIM_DIR/gfortran"
          # Make shim available to future steps
          echo "$SHIM_DIR" >> "$GITHUB_PATH"
          # Also use it in THIS step (GITHUB_PATH only affects subsequent steps)
          export PATH="$SHIM_DIR:$PATH"
          gfortran --version
          # Sanity: ensure mpifort exists and can find gfortran now
          "$(brew --prefix open-mpi)"/bin/mpifort -showme

      - name: Get PETSc HEAD hash
        id: petsc_hash
        run: |
          echo "hash=$(git ls-remote https://gitlab.com/petsc/petsc.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache PETSc
        id: cache_petsc
        uses: actions/cache@v4
        with:
          path: petsc
          key: v1-petsc-macos15-debug-kokkos-64bit-${{ steps.petsc_hash.outputs.hash }}

      - name: Build PETSc (debug, CPU, Open MPI + Fortran + petsc4py)
        if: steps.cache_petsc.outputs.cache-hit != 'true'
        shell: bash
        env:
          # Tell Open MPI wrappers exactly which gfortran to invoke
          OMPI_FC: ${{ steps.gf.outputs.gf }}
        run: |
          set -e
          export PETSC_DIR="$(pwd)/petsc"
          export PETSC_ARCH="arch-darwin-c-debug"
          git clone --depth=1 --branch=main https://gitlab.com/petsc/petsc.git
          cd petsc
          MPI_BIN="$(brew --prefix open-mpi)/bin"
          "${{ steps.venv.outputs.pybin }}" configure CC="${MPI_BIN}/mpicc" CXX="${MPI_BIN}/mpicxx" FC="${MPI_BIN}/mpifort" \
            --with-debugging=1 \
            --download-metis \
            --download-parmetis \
            --download-fblaslapack \
            --download-kokkos \
            --download-kokkos-kernels \
            --with-64-bit-indices \
            --with-make-np=3 \
            --with-petsc4py=1 \
            --with-python-exec="${{ steps.venv.outputs.pybin }}"
          make -j3
      - name: Build PFLARE (debug, CPU)
        shell: bash
        run: |
          set -e
          export PETSC_DIR="$(pwd)/petsc"
          export PETSC_ARCH="arch-darwin-c-debug"
          cd "$GITHUB_WORKSPACE"
          make -j3
          make python
          make -j3 tests

  # Triggers external repos to build which depend on 
  # PFLARE when the main branch is updated
  # Does this by sending a dispatch event
  notify_external_builds:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger PFLARE_spack repository_dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PFLARE_SPACK_TOKEN }}
          repository: PFLAREProject/PFLARE_spack
          event-type: pflare-main-updated

      - name: Trigger box_2D_gen_unstruc_mesh repository_dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BOX_MESH_DISPATCH_TOKEN }}
          repository: stevendargaville/box_2D_gen_unstruc_mesh
          event-type: pflare-main-updated